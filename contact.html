<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | GUJARAT SALES, Surat</title>
  <meta name="description" content="Call, WhatsApp or email GUJARAT SALES in Punagam, Surat. Open Monday to Saturday, 8 AM to 8 PM.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main>
    <section>
      <div class="wrap">
        <h2>Contact us</h2>
        <p>Call or WhatsApp us for prices and availability. You can also email us.</p>
        <div data-contact></div>
      </div>
    </section>

    <section>
      <div class="wrap">
        <h2>Visit the shop</h2>
        <p><strong>Address</strong><br><span data-field="address"></span></p>
        <p><strong>Opening hours</strong><br><span data-field="hours"></span></p>
        <a class="btn btn-mail" data-field="map" href="#">Open in Google Maps</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
